# Keeps the SHA-pinned actions and the digest-pinned base image current —
# pins without updates would just freeze known vulnerabilities in place.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as a minimum release age: let fresh releases settle first.
    cooldown:
      default-days: 7
    # Held back on purpose; the reason is in docs/maintenance.md's pin table.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # The coverage plugin requires vitest at exactly its own version.
      vitest:
        patterns: [vitest, "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
