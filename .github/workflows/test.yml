name: Test

# Reusable: called by ci.yml (every push and PR) and by docker.yml (before an
# image is published), so both run the exact same checks.
on:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile: CI must fail on a lockfile that does not match
      # package.json, not silently resolve a different dependency tree.
      - run: pnpm install --frozen-lockfile
      # Fail on known high/critical advisories in what ships in the image.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r build
      # Tests plus coverage; each package fails below 80% (vitest.config.ts).
      - run: pnpm test:coverage
      - run: node scripts/coverage-badge.mjs coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage.json
          retention-days: 1
