# Read-only demo: try Myzel quickly on the sample memory — browse, search,
# replay traces and, with a model configured, ask the agent. Nothing can change
# it (DEMO_MODE), and no model is needed to start it. Start with
# `make demo-up` or `docker compose -f docker-compose.demo.yml up -d --build`.
#
# The sample is mounted read-only and copied into a tmpfs at start, so query
# traces have somewhere to go and every restart begins from the pristine sample.
services:
  myzel-demo:
    build: .
    ports:
      # This machine only. The demo is for trying Myzel yourself, not for
      # hosting it for others (docs/premises.md).
      - "${MYZEL_BIND:-127.0.0.1}:${MYZEL_DEMO_PORT:-3800}:3800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sample-bundle:/sample:ro
    tmpfs:
      - /bundle:uid=1000,gid=1000,mode=0755
    command: ["sh", "-c", "cp -R /sample/. /bundle/ && exec node server/dist/index.js"]
    environment:
      DEMO_MODE: "true"
      BUNDLE_ROOT: /bundle
      # Optional, as for any instance.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # A low brake on token spend while playing around.
      RATE_LIMIT: ${RATE_LIMIT:-20}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      LLM_MAX_STEPS: ${LLM_MAX_STEPS:-}
    restart: unless-stopped
