# Portainer stack — pulls the prebuilt image from GHCR (no build step).
# Point Portainer at this file (Stacks → Add stack → Repository) and set
# the LLM env vars in the stack's environment variables UI.
services:
  myzel:
    image: ghcr.io/medienlampe/myzel:latest
    ports:
      # Published on the Docker host's loopback only. To reach Myzel from
      # other machines set MYZEL_BIND=0.0.0.0 (or one interface's address)
      # AND set AUTH_TOKEN — anyone who can reach the port can rewrite the memory.
      - "${MYZEL_BIND:-127.0.0.1}:3800:3800"
    # Lets the container reach a model server on the Docker host (e.g. llama.cpp
    # at http://host.docker.internal:8080/v1) — inside the container,
    # "localhost" is the container itself. (Ported from upstream understory.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent OKF bundle. Swap for a bind mount (e.g. /srv/okf-bundle:/bundle)
      # if you want to edit the markdown from the host / sync it with git.
      - okf-bundle:/bundle
    environment:
      BUNDLE_ROOT: /bundle
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Profiles (one memory per API key): not passed through on purpose — a
      # host path from .env would point the container at an unmounted
      # directory. See "Profiles" in the README for the volume and settings.
      # Hostnames you reach the server by (e.g. nas.local). Access by IP address
      # or localhost needs nothing; any other hostname is refused (DNS-rebinding guard).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Primary model
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      # Fallback model
      LLM_FALLBACK_API_BASE_URL: ${LLM_FALLBACK_API_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_API_FORMAT: ${LLM_FALLBACK_API_FORMAT:-openai}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_ALLOW_FOR: ${LLM_FALLBACK_ALLOW_FOR:-query}
      # Legacy compat (still supported)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GIT_AUTOCOMMIT: ${GIT_AUTOCOMMIT:-false}
      # Optional settings (see .env.example). Unset ones arrive empty, which
      # the server treats as "use the default".
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      RATE_LIMIT_BROWSE: ${RATE_LIMIT_BROWSE:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_MAX_STEPS: ${LLM_MAX_STEPS:-}
      HOT_MEMORY_RECALL_QA: ${HOT_MEMORY_RECALL_QA:-}
      DREAM_INTERVAL: ${DREAM_INTERVAL:-}
    restart: unless-stopped

volumes:
  okf-bundle:
